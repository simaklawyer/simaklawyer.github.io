<!DOCTYPE html>
<html lang="ru">
<head>

    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/playfair-display@5.0.0/index.css">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        body { background: #0a0a0a; color: #fff; }
        .gold-gradient {
            background: linear-gradient(135deg, #c9a96e, #e8d5a3, #c9a96e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .card-dark {
            background: linear-gradient(145deg, #1a1a1a, #111111);
            border: 1px solid rgba(201, 169, 110, 0.15);
        }
        .btn-gold {
            background: linear-gradient(135deg, #c9a96e, #a88a4e);
            color: #000;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-gold:hover {
            background: linear-gradient(135deg, #e8d5a3, #c9a96e);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(201, 169, 110, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 overflow-x-hidden">
    <div class="card-dark rounded-3xl p-8 sm:p-12 max-w-lg w-full text-center space-y-6">

        </div>

        </div>
        <p class="text-gray-400 text-sm sm:text-base leading-relaxed">

        </p>
        <div class="flex flex-col sm:flex-row gap-3 justify-center pt-2">
            <a href="/" class="btn-gold px-6 py-3 rounded-xl font-semibold text-sm inline-flex items-center justify-center gap-2">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                На главную
            </a>
            <a href="mailto:Arrusi@bk.ru" class="border-2 border-[#c9a96e] text-[#c9a96e] px-6 py-3 rounded-xl font-semibold text-sm inline-flex items-center justify-center gap-2 hover:bg-[#c9a96e] hover:text-black transition">
                <i data-lucide="mail" class="w-4 h-4"></i>
                Написать напрямую
            </a>
        </div>
        <p class="text-xs text-gray-600 pt-2">Симаков Владислав Юрьевич · Самозанятый · г. Владивосток</p>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
